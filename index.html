<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ed" />
    <meta name="description" content="%%DESCRIPTION%%" />
    <title>%%TITLE%%</title>
    %%METADATA%%
    %%EARLY_SCRIPT%%
    <link rel="icon" href="%%ASSETS%%assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="%%ASSETS%%src/styles/styles.css" />
    <script type="module" src="%%ASSETS%%src/js/app.js"></script>
  </head>
  <body data-base="%%BASE%%" data-assets="%%ASSETS%%" %%PAGE_DATA%%>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="%%BASE%%" aria-label="Theorama home"
        ><span class="brand-mark" aria-hidden="true">✳</span>theorama<span
          class="wordmark-period"
          >.</span
        ></a
      >
      <p class="header-slogan">Stay a little <em>curious.</em></p>
      <nav class="header-actions" aria-label="Site tools">
        <button
          class="icon-button"
          data-pane="appearance" hidden aria-controls="drawer" aria-haspopup="dialog"
          aria-label="Appearance"
          title="Appearance"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"
            />
          </svg>
        </button>
        <button class="icon-button" data-pane="notes" hidden aria-label="Your notes" title="Your notes" aria-controls="drawer" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 3h14v13l-5 5H5Z"/><path d="M14 21v-5h5M8 8h8m-8 4h6"/></svg>
        </button>
        <button class="icon-button more-button" data-pane="about" hidden aria-label="About Theorama" title="About Theorama" aria-controls="drawer" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
        </button>
      </nav>
    </header>

    %%MAIN%%

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside
      class="drawer"
      id="drawer"
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="drawer-label"
      hidden
    >
      <header class="drawer-topbar">
        <span id="drawer-label">Appearance</span>
        <button
          class="icon-button close-button"
          id="close-drawer"
          aria-label="Close panel"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
      </header>
      <div class="drawer-scroll" id="drawer-content"></div>
    </aside>
    <div id="book-root"></div>
    <div class="site-banner" id="site-banner" hidden>
      <p id="site-banner-message" role="status"></p>
      <button type="button" id="site-banner-action" hidden></button>
      <button type="button" id="site-banner-close" aria-label="Dismiss notification">×</button>
    </div>
  </body>
</html>
